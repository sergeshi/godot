name: Godot headless smoke test

on:
  push:
    branches:
      - feature/narrative-rpg-template
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  headless-smoke-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Godot 4.7
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 \
            https://github.com/godotengine/godot/releases/download/4.7-stable/Godot_v4.7-stable_linux.x86_64.zip \
            -o /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.7-stable_linux.x86_64
          ln -sf /tmp/godot/Godot_v4.7-stable_linux.x86_64 /tmp/godot/godot
          echo "/tmp/godot" >> "$GITHUB_PATH"
          /tmp/godot/godot --version

      - name: Import project and validate scripts
        run: godot --headless --editor --path . --quit

      - name: Start main scene headlessly
        run: timeout 20s godot --headless --path . --quit-after 10
